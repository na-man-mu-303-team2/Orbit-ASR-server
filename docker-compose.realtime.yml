services:
  realtime-gateway:
    build:
      context: ./services/realtime-gateway
      dockerfile: Dockerfile
    image: orbit-realtime-gateway:latest
    environment:
      NIM_CLIENT: ${NIM_CLIENT:-real}
      NIM_REALTIME_WS_URL: ${NIM_REALTIME_WS_URL:-ws://nim-asr:9000/v1/realtime?intent=transcription}
      NIM_LANGUAGE_CODE: ${NIM_LANGUAGE_CODE:-ko-KR}
      NIM_MODEL: ${NIM_MODEL:-nemotron-asr-streaming}
      NIM_AUDIO_CHUNK_MS: ${NIM_AUDIO_CHUNK_MS:-80}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_REALTIME_API_BASE: ${VITE_REALTIME_API_BASE:-}
    image: orbit-realtime-asr-web:latest
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - realtime-gateway

  nim-asr:
    profiles: ["nim"]
    image: nvcr.io/nim/nvidia/nemotron-asr-streaming:latest
    runtime: nvidia
    shm_size: 8gb
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?NGC_API_KEY is required}
      NIM_HTTP_API_PORT: 9000
      NIM_GRPC_API_PORT: 50051
      NIM_TAGS_SELECTOR: name=nemotron-asr-streaming,type=multi,batch_size=32
    ports:
      - "9000:9000"
      - "50051:50051"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
