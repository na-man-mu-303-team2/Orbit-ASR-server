[project]
name = "orbit-realtime-gateway"
version = "0.1.0"
description = "Realtime ASR spike gateway for Orbit"
requires-python = ">=3.11"
dependencies = [
  "aiortc>=1.9.0",
  "av>=12.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
